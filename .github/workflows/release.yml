name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build cross-platform binaries
        env:
          # GITHUB_REF_NAME is the tag (e.g. v1.2.3); strip the leading "v".
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          MODULE="github.com/webteractive/wormhole"
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"
          for t in $targets; do
            os="${t%/*}"; arch="${t#*/}"
            bin="wormhole"; [ "$os" = "windows" ] && bin="wormhole.exe"
            stage="wormhole_${os}_${arch}"
            echo "==> building $stage ($VERSION)"
            mkdir -p "build/$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X ${MODULE}/internal/cli.Version=${VERSION}" \
              -o "build/$stage/$bin" .
            cp README.md LICENSE "build/$stage/"
            if [ "$os" = "windows" ]; then
              (cd build && zip -qr "../dist/${stage}.zip" "$stage")
            else
              tar -C build -czf "dist/${stage}.tar.gz" "$stage"
            fi
          done
          (cd dist && sha256sum wormhole_* > checksums.txt)
          echo "=== artifacts ==="
          ls -la dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
